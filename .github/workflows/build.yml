name: Build Minigames
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12.1'
      - name: Build mod
        run: gradle --no-daemon build
      - name: Test capture rules
        run: |
          mkdir -p build/rules-test
          javac -d build/rules-test src/main/java/dev/ex/capture/CaptureRules.java tests/CaptureRulesTest.java
          java -ea -cp build/rules-test dev.ex.capture.CaptureRulesTest
      - uses: actions/upload-artifact@v4
        with:
          name: minigames-1.0.0
          path: build/libs/*.jar
          if-no-files-found: error
